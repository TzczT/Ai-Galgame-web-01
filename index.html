<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>长耳听见的那一年 · 微型视觉小说</title>
<meta name="description" content="一个发生在南方大学校园里的、关于声音与告别的微型视觉小说。"/>
<style>
/* ===========================================================
   长耳听见的那一年 —— UI（水彩纸感 / 藏青 × 暖金）
   =========================================================== */
:root{
  --navy:#2b3a63; --navy-d:#16203a; --navy-l:#4a5c8c;
  --gold:#e0b84c; --gold-d:#a8813a; --cream:#f7f1e2; --paper:#faf6ec;
  --ink:#312c25; --ink-l:#6a6153; --red:#c0503c;
  --ui-font:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --sans:"Yu Gothic UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:#171513; color:var(--ink); font-family:var(--ui-font);
  overflow:hidden; user-select:none;
}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.art{position:absolute;inset:0;overflow:hidden}
.art>svg{width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.layer>svg,.layer *{pointer-events:none!important}
#cg-layer{cursor:default}

/* ---------- 立绘 ---------- */
#sprite-layer{display:flex;justify-content:center;align-items:flex-end;transition:opacity .5s}
#sprite-layer .sprite{
  height:96%; margin-bottom:0; transform:translateY(0);
  transition:opacity .45s ease, transform .6s ease;
  filter:drop-shadow(0 18px 26px rgba(30,24,16,.28));
}
#sprite-layer .sprite>svg{height:100%;width:auto;display:block}
#sprite-layer.out .sprite{opacity:0;transform:translateY(14px)}
#sprite-layer.half{opacity:.55}

/* ---------- 文本框 ---------- */
.dialogue{
  position:absolute; left:4.5%; right:4.5%; bottom:3.2%; min-height:23%;
  padding:26px 34px 30px; border-radius:14px 14px 10px 10px;
  background:
    linear-gradient(180deg, rgba(250,246,236,.975), rgba(243,236,220,.965));
  box-shadow:0 12px 34px rgba(20,16,10,.42), inset 0 1px 0 rgba(255,255,255,.7);
  border:1px solid rgba(120,100,70,.28);
  backdrop-filter:blur(2px);
}
.dialogue::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background-image:radial-gradient(rgba(120,100,70,.09) 1px, transparent 1px);
  background-size:5px 5px; mix-blend-mode:multiply; opacity:.5;
}
.speaker{
  position:absolute; top:-17px; left:30px; padding:2px 20px 3px;
  background:linear-gradient(180deg,var(--navy-l),var(--navy));
  color:#fdf8ea; font-size:19px; letter-spacing:.16em; border-radius:20px;
  box-shadow:0 4px 12px rgba(20,20,40,.32), inset 0 1px 0 rgba(255,255,255,.25);
}
.speaker.empty{display:none}
#speaker.narr{background:linear-gradient(180deg,#8a8172,#6a6153)}
#speaker.heroine{background:linear-gradient(180deg,#e3c264,#b8902f);color:#2a2110}
.text{font-size:26px; line-height:1.86; letter-spacing:.045em; min-height:3.7em; color:#2f2a22}
.text .cursor{display:inline-block;width:.55em;color:var(--gold-d)}
.next-mark{position:absolute;right:28px;bottom:16px;color:var(--gold-d);font-size:15px;opacity:0;animation:bob 1.1s infinite ease-in-out}
.next-mark.on{opacity:.9}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* ---------- 选项 ---------- */
.choice-layer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(18,16,12,.34);backdrop-filter:blur(1.5px)}
.choice-layer.on{display:flex}
.choice{
  min-width:min(66vw,760px); padding:18px 30px; font-size:24px; font-family:var(--ui-font);
  color:#2f2a22; letter-spacing:.06em; cursor:pointer; text-align:left;
  background:linear-gradient(180deg,rgba(252,248,238,.97),rgba(238,230,212,.95));
  border:1px solid rgba(120,100,70,.4); border-left:6px solid var(--gold);
  border-radius:8px; box-shadow:0 8px 22px rgba(22,18,10,.35);
  transition:transform .16s ease, box-shadow .16s ease, border-left-color .16s;
}
.choice:hover{transform:translateX(8px) scale(1.012); box-shadow:0 12px 28px rgba(22,18,10,.45); border-left-color:var(--navy-l)}
.choice .tag{font-size:14px;color:var(--ink-l);display:block;letter-spacing:.1em;margin-bottom:4px}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none;font-family:var(--sans)}
.hud-left,.hud-right{display:flex;gap:6px;align-items:center;pointer-events:auto}
.tape-lamp{width:11px;height:11px;border-radius:50%;background:#7a3a2c;box-shadow:0 0 0 rgba(0,0,0,0);transition:all .3s}
.tape-lamp.on{background:#e0503c;box-shadow:0 0 12px 3px rgba(224,80,60,.65);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.45}}
.tape-txt{font-size:13px;color:#f7f1e2;letter-spacing:.14em;text-shadow:0 1px 3px rgba(0,0,0,.6);opacity:.85}
.hbtn{
  font-family:var(--sans);font-size:13px;letter-spacing:.1em;color:#f8f3e6;cursor:pointer;
  padding:6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.28);
  background:rgba(24,22,34,.5);transition:all .18s;
}
.hbtn:hover{background:rgba(43,58,99,.85);border-color:var(--gold)}
.hbtn.active{background:var(--gold);color:#251d0c;border-color:var(--gold-d)}

/* ---------- 章节卡 ---------- */
.chapter-card{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(14,12,10,.72);opacity:0;transition:opacity .7s;pointer-events:none;text-align:center;
}
.chapter-card.on{opacity:1}
.chapter-card .cc-k{font-size:18px;letter-spacing:.6em;color:var(--gold);margin-bottom:14px;font-family:var(--sans)}
.chapter-card .cc-t{font-size:54px;color:#fbf6ea;letter-spacing:.14em;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.chapter-card .cc-s{font-size:17px;color:rgba(247,241,226,.72);margin-top:16px;letter-spacing:.2em}
.chapter-card .cc-hint{margin-top:46px;font-size:13px;letter-spacing:.28em;color:rgba(224,184,76,.9);animation:blink 1.6s infinite ease-in-out}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.ending-card{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,10,14,.8);opacity:0;transition:opacity 1.1s;pointer-events:none;text-align:center;
}
.ending-card.on{opacity:1}
.ending-card .e-k{font-size:17px;letter-spacing:.7em;color:var(--gold);font-family:var(--sans)}
.ending-card .e-t{font-size:62px;color:#fdfaf0;margin:20px 0 10px;letter-spacing:.16em}
.ending-card .e-s{font-size:19px;color:rgba(253,250,240,.8);letter-spacing:.18em;max-width:70vw;line-height:2}

/* ---------- 标题画面 ---------- */
#title-art{filter:saturate(.95)}
.title-veil{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 20% 30%, rgba(255,248,226,.2), rgba(20,18,14,.55) 78%),
  linear-gradient(0deg, rgba(14,12,10,.72), rgba(14,12,10,.15) 50%, rgba(14,12,10,.4));}
.title-inner{position:absolute;left:9%;top:50%;transform:translateY(-50%);color:#fdf9ef;max-width:640px}
.t-sub{font-size:15px;letter-spacing:.55em;color:var(--gold);font-family:var(--sans);margin-bottom:10px}
.t-main{font-size:72px;margin:0 0 12px;letter-spacing:.1em;text-shadow:0 8px 30px rgba(0,0,0,.55)}
.t-line{font-size:19px;letter-spacing:.16em;color:rgba(253,249,239,.86);margin-bottom:34px}
.t-menu{display:flex;flex-direction:column;gap:11px;width:330px}
.t-btn{
  font-family:var(--ui-font);font-size:20px;letter-spacing:.14em;color:#f8f3e6;cursor:pointer;
  padding:13px 22px;border-radius:6px;text-align:left;
  border:1px solid rgba(255,255,255,.28);background:rgba(22,20,30,.46);
  transition:all .2s;backdrop-filter:blur(3px);
}
.t-btn:hover{background:rgba(43,58,99,.9);border-color:var(--gold);transform:translateX(8px)}
.t-btn.primary{background:linear-gradient(90deg,rgba(224,184,76,.92),rgba(184,144,47,.85));color:#2a2110;border-color:#f0d896}
.t-btn.primary:hover{background:linear-gradient(90deg,#f0d896,#e0b84c)}
.t-foot{margin-top:30px;font-size:13px;letter-spacing:.2em;color:rgba(253,249,239,.6);font-family:var(--sans)}

/* ---------- 姓名 ---------- */
#name-screen{background:radial-gradient(80% 60% at 50% 40%, #2c3a5e, #14171f 80%)}
.name-card{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,88vw);padding:40px 44px;border-radius:12px;text-align:center;
  background:linear-gradient(180deg,#fdf8ec,#f0e8d4);box-shadow:0 20px 60px rgba(0,0,0,.55);
  border:1px solid rgba(120,100,70,.35);
}
.name-card::after{content:"";position:absolute;left:24px;right:24px;top:96px;border-top:1px dashed rgba(120,100,70,.4)}
.n-k{font-size:15px;letter-spacing:.5em;color:var(--gold-d);font-family:var(--sans)}
.n-tip{font-size:15px;color:var(--ink-l);line-height:1.9;margin:16px 0 26px}
#name-input{
  width:100%;font-family:var(--ui-font);font-size:34px;text-align:center;letter-spacing:.2em;
  padding:12px 8px;border:none;border-bottom:2px solid rgba(120,100,70,.45);
  background:transparent;color:var(--ink);outline:none;
}
#name-input:focus{border-bottom-color:var(--gold-d)}
.n-row{display:flex;gap:12px;margin-top:34px;justify-content:center}
.n-row .t-btn{font-size:17px;text-align:center;width:auto;background:rgba(43,58,99,.92);color:#f8f3e6}

/* ---------- 弹层 ---------- */
.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,10,8,.62);backdrop-filter:blur(3px);z-index:50}
.modal.on{display:flex}
.modal-box{
  width:min(1000px,92vw);max-height:86vh;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,#fbf6ea,#f1e9d6);box-shadow:0 24px 70px rgba(0,0,0,.6);border:1px solid rgba(120,100,70,.4);
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;padding:14px 22px;
  background:linear-gradient(180deg,var(--navy-l),var(--navy));color:#fdf8ea;
  font-size:20px;letter-spacing:.24em;
}
.modal-head .cls{cursor:pointer;font-size:15px;font-family:var(--sans);letter-spacing:.1em;padding:4px 12px;border:1px solid rgba(255,255,255,.35);border-radius:14px;background:transparent;color:#fdf8ea}
.modal-head .cls:hover{background:rgba(255,255,255,.16)}
.modal-body{padding:18px 22px;overflow:auto}
.m-row{display:flex;gap:14px;flex-wrap:wrap}
.m-card{
  width:230px;border:1px solid rgba(120,100,70,.35);border-radius:8px;overflow:hidden;background:#fffdf6;
  cursor:pointer;transition:transform .16s, box-shadow .16s;
}
.m-card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(30,24,14,.28)}
.m-card .thumb{height:130px;overflow:hidden;background:#e8dfc8;position:relative}
.m-card .thumb>svg{width:100%;height:100%;display:block}
.m-card .thumb.locked>svg{filter:grayscale(1) blur(9px) brightness(1.02);opacity:.5}
.m-card .cap{padding:9px 12px;font-size:15px;letter-spacing:.06em}
.m-card .cap small{display:block;color:var(--ink-l);font-size:12px;margin-top:3px;letter-spacing:.08em}
.m-card.locked{filter:grayscale(.5)}
.m-track{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px;margin-bottom:9px;border-radius:8px;background:#fffdf6;border:1px solid rgba(120,100,70,.28);cursor:pointer}
.m-track:hover{background:#f6efdd;border-color:var(--gold)}
.m-track .tt{font-size:19px;letter-spacing:.1em}
.m-track .td{font-size:13px;color:var(--ink-l);margin-top:3px;letter-spacing:.06em}
.m-track .tp{font-family:var(--sans);font-size:13px;color:var(--gold-d)}
.m-track.playing{border-color:var(--gold);background:#fbf3dd}
.m-track .eq{display:inline-block;width:9px;text-align:center}
.hist{padding:6px 2px}
.hist .hi{padding:9px 12px;border-bottom:1px dashed rgba(120,100,70,.25);font-size:17px;line-height:1.8}
.hist .hi b{color:var(--navy);letter-spacing:.12em;margin-right:10px;font-weight:600}
.hist .hi.hz b{color:var(--gold-d)}
.hist .hi.nr{color:var(--ink-l);font-style:italic}
.slot{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;margin-bottom:9px;border-radius:8px;background:#fffdf6;border:1px solid rgba(120,100,70,.28)}
.slot .si{font-size:15px;color:var(--ink-l)}
.slot .sn{font-size:17px}
.slot button{font-family:var(--sans);font-size:13px;padding:6px 14px;margin-left:8px;border-radius:14px;border:1px solid rgba(120,100,70,.45);background:#f6efdd;cursor:pointer;color:var(--ink)}
.slot button:hover{background:var(--gold);border-color:var(--gold-d)}
.set-row{display:flex;align-items:center;gap:16px;padding:12px 4px;font-size:17px}
.set-row label{width:130px;letter-spacing:.14em}
.set-row input[type=range]{flex:1;accent-color:var(--gold-d)}
.set-row .val{width:60px;text-align:right;font-family:var(--sans);color:var(--ink-l)}
.help p{font-size:16px;line-height:2;margin:8px 0;color:#3a342a}
.help h4{margin:20px 0 6px;color:var(--navy);letter-spacing:.16em}
.toast{
  position:absolute;left:50%;bottom:14%;transform:translateX(-50%) translateY(10px);
  padding:10px 26px;border-radius:22px;background:rgba(24,20,34,.88);color:#f8f3e6;
  font-size:15px;letter-spacing:.14em;opacity:0;transition:all .3s;pointer-events:none;z-index:60;font-family:var(--sans);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 淡入淡出 */
#fx-vig{background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0), rgba(20,14,6,.42) 100%)}
.fadeout{opacity:0;transition:opacity .5s}
@media (max-width:900px){
  .t-main{font-size:46px} .text{font-size:21px} .dialogue{min-height:27%}
  .choice{font-size:19px;min-width:86vw} .modal-body{padding:12px}
}

</style>
</head>
<body>
<div id="app">

  <!-- 标题画面 -->
  <section id="title-screen" class="screen active">
    <div id="title-art" class="art"></div>
    <div class="title-veil"></div>
    <div class="title-inner">
      <div class="t-sub">微型视觉小说</div>
      <h1 class="t-main">长耳听见的那一年</h1>
      <div class="t-line">——把最后一盘磁带，交给下一个秋天</div>
      <div class="t-menu">
        <button data-act="start" class="t-btn primary">开始新的一期</button>
        <button data-act="continue" class="t-btn">继续收听</button>
        <button data-act="gallery" class="t-btn">CG 鉴赏</button>
        <button data-act="music" class="t-btn">音乐鉴赏</button>
        <button data-act="help" class="t-btn">关于 / 操作</button>
      </div>
      <div class="t-foot">全年龄 · 纯爱 · 单线 · 约 20–30 分钟</div>
    </div>
  </section>

  <!-- 姓名输入 -->
  <section id="name-screen" class="screen">
    <div class="name-card">
      <div class="n-k">借书卡 · 姓名栏</div>
      <p class="n-tip">名字会被写在卡片上，也会被念进最后一期节目里。</p>
      <input id="name-input" maxlength="8" placeholder="江知远" autocomplete="off"/>
      <div class="n-row">
        <button id="name-ok" class="t-btn primary">就写这个</button>
        <button id="name-default" class="t-btn">用默认名「江知远」</button>
      </div>
    </div>
  </section>

  <!-- 游戏画面 -->
  <section id="game-screen" class="screen">
    <div id="bg-layer" class="layer art"></div>
    <div id="sprite-layer" class="layer"></div>
    <div id="cg-layer" class="layer"></div>
    <div id="fx-vig" class="layer"></div>
    <div id="chapter-card" class="chapter-card"></div>
    <div id="hud" class="hud">
      <div class="hud-left">
        <span id="tape-lamp" class="tape-lamp"></span>
        <span id="tape-txt" class="tape-txt">REC 00:00</span>
      </div>
      <div class="hud-right">
        <button class="hbtn" data-act="log" title="历史回顾">回顾</button>
        <button class="hbtn" data-act="auto" title="自动播放">自动</button>
        <button class="hbtn" data-act="skip" title="跳过">跳过</button>
        <button class="hbtn" data-act="save" title="存档">存档</button>
        <button class="hbtn" data-act="load" title="读档">读档</button>
        <button class="hbtn" data-act="config" title="设置">设置</button>
        <button id="hud-title" class="hbtn" data-act="title" title="回到标题">标题</button>
      </div>
    </div>
    <div id="dialogue" class="dialogue">
      <div id="speaker" class="speaker"></div>
      <div id="text" class="text"></div>
      <div id="nextmark" class="next-mark">▼</div>
    </div>
    <div id="choice-layer" class="choice-layer"></div>
    <div id="ending-card" class="ending-card"></div>
  </section>

  <!-- 弹层 -->
  <div id="modal" class="modal"><div id="modal-box" class="modal-box"><div id="modal-head" class="modal-head"></div><div id="modal-body" class="modal-body"></div></div></div>
  <div id="toast" class="toast"></div>
</div>
<script>
/* ===========================================================
 *  svg.js —— 水彩渲染底层库
 *  生成真正的 SVG（湿边 / 纸纹 / 晕染 / 颗粒），全部离线程序化绘制
 * =========================================================== */
var ART = (function () {

  // ---------- 随机 ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function makeRnd(seed) {
    var r = mulberry32(seed >>> 0);
    return {
      n: r,
      rng: function (a, b) { return a + (b - a) * r(); },
      int: function (a, b) { return Math.floor(a + (b - a + 1) * r()); },
      pick: function (arr) { return arr[Math.floor(r() * arr.length) % arr.length]; },
      sign: function () { return r() < 0.5 ? -1 : 1; }
    };
  }
  function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- 数值 ----------
  function round2(v) { return Math.round(v * 100) / 100; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mixHex(h1, h2, t) {
    function p(h) { h = h.replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
    var a = p(h1), b = p(h2);
    function hex(v) { v = Math.round(clamp(v, 0, 255)).toString(16); return v.length === 1 ? '0' + v : v; }
    return '#' + hex(lerp(a[0], b[0], t)) + hex(lerp(a[1], b[1], t)) + hex(lerp(a[2], b[2], t));
  }
  function shade(hex, t) { // t>0 变亮，t<0 变深
    return t >= 0 ? mixHex(hex, '#ffffff', t) : mixHex(hex, '#1a1712', -t);
  }
  function alpha(hex, a) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex); if (!m) return hex;
    return 'rgba(' + parseInt(m[1].slice(0, 2), 16) + ',' + parseInt(m[1].slice(2, 4), 16) + ',' + parseInt(m[1].slice(4, 6), 16) + ',' + round2(a) + ')';
  }

  // ---------- 路径 ----------
  function pt(x, y) { return [x, y]; }
  function polyPath(pts, close) {
    var d = 'M' + round2(pts[0][0]) + ' ' + round2(pts[0][1]);
    for (var i = 1; i < pts.length; i++) d += 'L' + round2(pts[i][0]) + ' ' + round2(pts[i][1]);
    return d + (close !== false ? 'Z' : '');
  }
  function smoothPath(pts, close) {
    if (pts.length < 3) return polyPath(pts, close);

  { text: '十月。《散文选读》的作业下来了：两人一组，做一个“口述史”。' },

    flags: {}, mem: [], love: 0,
    idx: 0, owner: null, seen: {}, cgs: {}, mus: {}, choiceLog: [],
    autoTimer: null, skipTimer: null, typing: false,
    settings: { speed: 22, music: 0.5, sfx: 0.6, autoWait: 1500, effect: true },
    playing: 'gold'
  };
  var BG = { bg: 'lib', sprite: null, cg: null, music: null, lamp: false, speaker: '', heroine: false };
  var META = null;
  var bgEl, spriteEl, cgEl, textEl, spkEl, nextEl, choiceEl, chapterEl, endingEl, hudEl, toastEl;
  var typingTimer = null, fullText = '', typePos = 0, textDone = true, lineStart = 0;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function applyName(s) {
    return String(s).replace(/\{name\}/g, G.name).replace(/\{name1\}/g, G.name.charAt(0));
  }

  /* ---------------- 存档 ---------------- */
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function load(k) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function snapshot(label) {
    return {
      v: VERSION, name: G.name, idx: G.idx, flags: JSON.parse(JSON.stringify(G.flags)),
      mem: G.mem.slice(), love: G.love, chapter: G.chapter, ts: Date.now(),
      label: label || (META.script[G.idx] && META.script[G.idx].s ? String(META.script[G.idx].s).slice(0, 14) : '')
    };
  }
  function applySnapshot(s) {
    G.name = s.name || G.name; G.idx = s.idx || 0; G.flags = s.flags || {}; G.mem = s.mem || []; G.love = s.love || 0;
    G.chapter = s.chapter || '序章';
    renderFromScratch();
  }
  function autoSave() { store(VERSION + '_auto', snapshot('自动存档')); }
  function saveSlot(i) { store(VERSION + '_s' + i, snapshot()); }
  function loadSlot(i) { var s = load(VERSION + '_s' + i); return s; }
  function lastSave() { return load(VERSION + '_auto') || load(VERSION + '_quick') || null; }

  /* ---------------- 条件 ---------------- */
  function cond(c) {
    if (!c) return true;
    if (typeof c === 'function') return !!c(G);
    // 注意：内联 script 里 '&' 可能被 HTML 解析转义，所以条件用逗号分隔的 AND 列表
    c = String(c).replace(/&amp;/g, '&').replace(/s*&&s*/g, ',');
    return c.split(',').every(function (one) {
      one = one.trim();
      var m;
      if ((m = /^flags\.(\w+)$/.exec(one))) return !!G.flags[m[1]];
      if ((m = /^!flags\.(\w+)$/.exec(one))) return !G.flags[m[1]];
      if ((m = /^love>=(-?\d+)$/.exec(one))) return G.love >= parseInt(m[1], 10);
      if ((m = /^mem>=(\d+)$/.exec(one))) return G.mem.length >= parseInt(m[1], 10);
      if ((m = /^has:(.+)$/.exec(one))) return G.mem.indexOf(m[1]) >= 0;
      return true;
    });
  }
  var LABELS = null;
  function buildLabels() {
    LABELS = {};
    for (var i = 0; i < META.script.length; i++) {
      var n = META.script[i];
      if (n && n.t === 'label' && n.label && LABELS[n.label] === undefined) LABELS[n.label] = i;
    }
  }
  function labelIndex(name) {
    if (!LABELS) buildLabels();
    return LABELS[name] === undefined ? -1 : LABELS[name];
  }

  /* ---------------- 渲染 ---------------- */
  function setBG(bg, opt) {
    if (!bg || BG.bg === bg) return;
    BG.bg = bg;
    var svg = ARTWORK.get(bg);
    bgEl.innerHTML = svg;
    if (G.settings.effect) {
      bgEl.animate ? bgEl.animate([{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 700, easing: 'ease-out' }) : 0;
    }
  }
  function setSprite(expr, opt) {
    opt = opt || {};
    if (!expr) { spriteEl.innerHTML = ''; BG.sprite = null; return; }
    var key = expr + (opt.mirror ? 'm' : '');
    if (BG.sprite === key) return;
    BG.sprite = key;
    spriteEl.innerHTML = '<div class="sprite">' + ARTWORK.spriteSVG(expr, opt.mirror) + '</div>';
    spriteEl.classList.remove('out');
  }
  function setCG(key, opt) {
    if (!key) { cgEl.innerHTML = ''; cgEl.style.display = 'none'; BG.cg = null; return; }
    BG.cg = key; G.cgs[key] = 1; store(VERSION + '_cg', G.cgs);
    cgEl.style.display = 'block';
    cgEl.innerHTML = '<div class="cg-wrap">' + ARTWORK.get(key) + '</div>';
    cgEl.style.opacity = 0;
    requestAnimationFrame(function () { cgEl.style.transition = 'opacity .8s'; cgEl.style.opacity = 1; });
    spriteEl.innerHTML = ''; BG.sprite = null;
  }
  function setMusic(name) {
    if (!name || BG.music === name) return;
    BG.music = name; G.mus[name] = 1; store(VERSION + '_mus', G.mus);
    SOUND.play(name);
    G.playing = name;
  }
  function lamp(on) {
    BG.lamp = on;
    $('tape-lamp').classList.toggle('on', !!on);
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastEl._t); toastEl._t = setTimeout(function () { toastEl.classList.remove('on'); }, 1500);
  }

  /* ---------------- 打字机 ---------------- */
  function typeWrite(s) {
    fullText = applyName(s);
    typePos = 0; textDone = false;
    lineStart = Date.now();
    nextEl.classList.remove('on');
    textEl.textContent = '';
    clearInterval(typingTimer);
    var speed = G.settings.speed;
    if (speed <= 0) { finishText(); return; }
    typingTimer = setInterval(function () {
      typePos += Math.min(2, fullText.length - typePos);
      textEl.textContent = fullText.slice(0, typePos);
      if (typePos >= fullText.length) finishText();
    }, speed);
    // 看门狗：任何异常导致打字停摆时，1.2 秒后强制补全，绝不让玩家卡在"文字不动"
    if (G._wd) clearTimeout(G._wd);
    G._wd = setTimeout(function () { if (!textDone) finishText(); }, 1200 + fullText.length * speed * 0.6);
  }
  function finishText() {
    clearInterval(typingTimer);
    textEl.textContent = fullText;
    textDone = true;
    if (speedZero()) { }
    nextEl.classList.add('on');
  }
  function speedZero() { return G.settings.speed <= 0; }

  /* ---------------- 主循环 ---------------- */
  function run() {
    try {
      // 推进环看门狗：同一节点短时间内被反复到达，强制往后走，保证任何情况下都能继续
      var now = Date.now();
      if (G.__lastIdx === G.idx) {
        if (now - (G.__lastAt || 0) > 650) {
          if (G.__loopCount === undefined) G.__loopCount = 0;
          G.__loopCount++;
          if (G.__loopCount > 2) { G.__loopCount = 0; G.idx++; }
          G.__lastAt = now;
        }
      } else { G.__lastIdx = G.idx; G.__lastAt = now; G.__loopCount = 0; }
      runInner();
    } catch (e) {
      // 任何异常都不能让剧情停住：记录后强制推进一格
      if (window.console && console.warn) console.warn('[galgame] run() 异常，已强制推进：', e);
      G.idx++;
    }
  }
  function runInner() {
    if (G.endingLock) return; // 结局卡播放期间冻结流程，避免两次 run 竞态穿透到另一个结局
    clearTimeout(G.autoTimer);
    var guard = 0;
    while (guard++ < 20000) {
      if (G.idx >= META.script.length) {
        // 剧本播完：回到标题，给出明确提示
        toast('这一期播完了。回到标题可以重录。');
        showScreen('title-screen');
        return;
      }
      if (G.idx < 0) G.idx = 0;
      var n = META.script[G.idx];
      if (typeof n === 'string') { G.idx++; continue; }
      var next = false;
      switch (n.t) {
        case 'label': G.idx++; next = true; break;
        case 'chapter':
          G.chapter = n.name;
          showChapter(n.name, n.sub, function () { G.idx++; run(); });
          return;
        case 'bg': setBG(n.name); G.idx++; next = true; break;
        case 'sprite': setSprite(n.e, { mirror: n.mirror }); G.idx++; next = true; break;
        case 'hide': setSprite(null); G.idx++; next = true; break;
        case 'cg': setCG(n.name); G.idx++; next = true; break;
        case 'cgEnd': setCG(null); G.idx++; next = true; break;
        case 'music': setMusic(n.name); G.idx++; next = true; break;
        case 'lamp': lamp(n.on); G.idx++; next = true; break;
        case 'sfx': SOUND.sfx(n.name); G.idx++; next = true; break;
        case 'fx': if (n.name === 'shake' && G.settings.effect) { document.getElementById('app').animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-7px,4px)' }, { transform: 'translate(6px,-3px)' }, { transform: 'translate(0,0)' }], { duration: 420 }); } G.idx++; next = true; break;
        case 'set': G.flags[n.k] = (n.v === undefined ? 1 : n.v); if (n.love) G.love += n.love; if (n.mem && G.mem.indexOf(n.mem) < 0) G.mem.push(n.mem); G.idx++; next = true; break;
        case 'mem': if (G.mem.indexOf(n.s) < 0) G.mem.push(n.s); G.idx++; next = true; break;
        case 'jump':
          var ti = labelIndex(n.target || n.label);
          if (ti < 0) { console.warn('missing label', n.label); G.idx++; } else G.idx = ti;
          next = true; break;
        case 'if':
        case 'route':
          var tIdx = labelIndex(cond(n.cond) ? n.then : n.else);
          G.idx = tIdx >= 0 ? tIdx : G.idx + 1;
          next = true; break;
        case 'ending':
          showEnding(n.kind, n.title, n.sub, n.after);
          return;
        case 'choice':
          showChoice(n); return;
        case 'say':
        default:
          if (n.t === 'say' || n.speak !== undefined || n.text !== undefined) {
            var who = n.who === undefined ? (n.t === 'say' ? '' : '') : n.who;
            var isH = who === 'longer' || who === '她';
            spkEl.className = 'speaker' + (who ? (isH ? ' heroine' : '') : ' narr');
            if (!who) { spkEl.className = 'speaker empty'; spkEl.textContent = ''; }
            else spkEl.textContent = who === 'longer' ? (n.label2 || 'longer') : who;
            G.seen[G.idx] = 1;
            G.history = G.history || [];
            G.history.push({ s: who, x: applyName(n.text || ''), c: G.chapter });
            if (G.history.length > 400) G.history.shift();
            typeWrite(n.text || '');
            autoSave();
            if (G.skipOn && G.seen[G.idx]) { G.skipTimer = setTimeout(function () { if (G.skipOn) { finishText(); click(); } }, 26); }
            else if (G.autoOn) {
              var dur = Math.min(9000, 900 + (n.text || '').length * (G.settings.speed + 42));
              G.autoTimer = setTimeout(function () { if (G.autoOn) click(); }, dur + G.settings.autoWait);
            }
            return;
          }
          G.idx++; next = true;
      }
      if (!next) return;
    }
  }
  function click() {
    G.clicks = (G.clicks || 0) + 1;
    try { SOUND.resume(); } catch (e) { }
    if (chapterEl.classList.contains('on')) { if (G.chapterDismiss) G.chapterDismiss(); return; }
    if (!textDone) {
      finishText();
      // 这一句已经显示了足够久，说明玩家是在"往下读"，同一次点击直接推进
      if (Date.now() - lineStart > 90) { /* 继续往下走 */ } else { return; }
    }
    if (choiceEl.classList.contains('on')) return;
    if (endingEl.classList.contains('on')) return;
    try { SOUND.sfx('click'); } catch (e) { }
    G.idx++; run();
  }

  function showChoice(n) {
    choiceEl.innerHTML = '';
    var opts = n.options.filter(function (o) { return cond(o.cond); });
    opts.forEach(function (o, i) {
      var b = document.createElement('div');
      b.className = 'choice';
      b.innerHTML = (o.tag ? '<span class="tag">' + esc(o.tag) + '</span>' : '') + esc(applyName(o.text));
      b.onclick = function () {
        SOUND.sfx('select');
        choiceEl.classList.remove('on'); choiceEl.innerHTML = '';
        if (o.set) { for (var k in o.set) G.flags[k] = o.set[k]; }
        if (o.love) G.love += o.love;
        if (o.mem && G.mem.indexOf(o.mem) < 0) G.mem.push(o.mem);
        G.choiceLog.push({ c: G.chapter, text: o.text, at: Date.now() });
        var ti = labelIndex(o.goto);
        if (ti < 0) { console.warn('bad goto ' + o.goto); G.idx++; } else G.idx = ti;
        autoSave();
        run();
      };
      choiceEl.appendChild(b);
    });
    choiceEl.classList.add('on');
  }

  function showChapter(name, sub, cb) {
    if (!G.settings.effect) { cb(); return; }
    chapterEl.innerHTML = '<div class="cc-k">CHAPTER</div><div class="cc-t">' + esc(name) + '</div>' +
      (sub ? '<div class="cc-s">' + esc(sub) + '</div>' : '') +
      '<div class="cc-hint">点击任意处继续</div>';
    chapterEl.classList.add('on');
    var fired = false, started = Date.now();
    function done() {
      if (fired) return; fired = true;
      clearTimeout(t1);
      chapterEl.classList.remove('on');
      setTimeout(cb, 320);
    }
    var t1 = setTimeout(done, 1900);
    // 点击章节卡立即进入正文（至少要显示 350ms，避免误触）
    G.chapterDismiss = function () { if (Date.now() - started > 350) { done(); return true; } return false; };
  }
  function showEnding(kind, title, sub, after) {
    G.endingLock = true;
    endingEl.innerHTML = '<div class="e-k">' + (kind === 'true' ? 'TRUE END' : 'NORMAL END') + '</div>' +
      '<div class="e-t">' + esc(title) + '</div><div class="e-s">' + esc(sub) + '</div>';
    endingEl.classList.add('on');
    endingEl.style.pointerEvents = 'auto';
    G.ending = kind;
    store(VERSION + '_end_' + kind, { ts: Date.now(), name: G.name, love: G.love, mem: G.mem.slice(), choices: G.choiceLog });
    setTimeout(function () {
      endingEl.classList.remove('on');
      endingEl.style.pointerEvents = '';
      setTimeout(function () {
        var ti = after ? labelIndex(after) : -1;
        G.idx = ti >= 0 ? ti : G.idx + 1;
        G.endingLock = false;
        run();
      }, 1400);
    }, 5200 + (after ? 0 : 0));
  }

  /* ---------------- 弹层 ---------------- */
  function modal(title, html) {
    $('modal-head').innerHTML = '<span>' + esc(title) + '</span><button class="cls">关闭</button>';
    $('modal-body').innerHTML = html;
    $('modal').classList.add('on');
    $('modal-head').querySelector('.cls').onclick = function () { SOUND.sfx('back'); closeModal(); };
  }
  function closeModal() { $('modal').classList.remove('on'); }

  function openGallery() {
    var list = (META.cglist || []);
    var h = '<div class="m-row">';
    list.forEach(function (c) {
      var got = !!G.cgs[c.key];
      h += '<div class="m-card' + (got ? '' : ' locked') + '" data-cg="' + c.key + '">' +
        '<div class="thumb' + (got ? '' : ' locked') + '">' + ARTWORK.get(c.key) + '</div>' +
        '<div class="cap">' + esc(got ? c.name : '？？？') + '<small>' + esc(c.desc || '') + '</small></div></div>';
    });
    h += '</div>';
    modal('CG 鉴赏 ' + Object.keys(G.cgs).length + ' / ' + list.length, h);
    Array.prototype.forEach.call($('modal-body').querySelectorAll('[data-cg]'), function (el) {
      el.onclick = function () {
        var k = el.getAttribute('data-cg');
        if (!G.cgs[k]) { toast('这段录音还没有被翻出来'); return; }
        SOUND.sfx('select');
        var big = document.createElement('div');
        big.style.cssText = 'position:absolute;inset:0;background:rgba(8,8,10,.94);z-index:70;display:flex;align-items:center;justify-content:center';
        big.innerHTML = '<div style="width:92vw;height:86vh">' + ARTWORK.get(k) + '</div>';
        big.onclick = function () { big.remove(); };
        document.getElementById('app').appendChild(big);
      };
    });
  }
  function openMusic() {
    var list = META.musiclist || [];
    var h = '';
    list.forEach(function (m) {
      var got = !!G.mus[m.key] || m.key === 'gold';
      h += '<div class="m-track' + (G.playing === m.key ? ' playing' : '') + '" data-m="' + m.key + '" data-lock="' + (got ? 0 : 1) + '">' +
        '<div><div class="tt"><span class="eq">♪</span> ' + esc(got ? m.name : '？？？') + '</div><div class="td">' + esc(m.desc || '') + '</div></div>' +
        '<div class="tp">' + (got ? (G.playing === m.key ? '正在播放' : '播放') : '未解锁') + '</div></div>';
    });
    modal('音乐鉴赏', h);
    Array.prototype.forEach.call($('modal-body').querySelectorAll('[data-m]'), function (el) {
      el.onclick = function () {
        if (el.getAttribute('data-lock') === '1') { toast('听到之后才能收录'); return; }
        var k = el.getAttribute('data-m');
        BG.music = null; setMusic(k); G.playing = k;
        SOUND.sfx('select');
        openMusic();
      };
    });
  }
  function openLog() {
    var h = '<div class="hist">';
    (G.history || []).slice(-220).forEach(function (e) {
      var cls = e.s === 'longer' ? 'hz' : (e.s ? '' : 'nr');
      h += '<div class="hi ' + cls + '">' + (e.s ? '<b>' + esc(e.s === 'longer' ? 'longer' : e.s) + '</b>' : '') + esc(e.x) + '</div>';
    });
    h += '</div>';
    modal('历史回顾', h);
    var b = $('modal-body'); b.scrollTop = b.scrollHeight;
  }
  function openSave(mode) {
    var h = '';
    for (var i = 1; i <= 5; i++) {
      var s = loadSlot(i);
      var head = s ? (s.chapter + ' · ' + (s.label || '')) : '空';
      var ti = s ? new Date(s.ts).toLocaleString('zh-CN') : '';
      h += '<div class="slot"><div><div class="sn">第 ' + i + ' 槽 · ' + esc(head) + '</div><div class="si">' + esc(ti) + '</div></div>' +
        '<div>' + (mode === 'save' ? '<button data-save="' + i + '">存档</button>' : '') +
        '<button data-load="' + i + '"' + (s ? '' : ' disabled') + '>读档</button>' +
        '<button data-del="' + i + '"' + (s ? '' : ' disabled') + '>删除</button></div></div>';
    }
    modal(mode === 'save' ? '存档' : '读档', h);
    var body = $('modal-body');
    Array.prototype.forEach.call(body.querySelectorAll('button'), function (b) {
      b.onclick = function () {
        var i = parseInt(b.getAttribute('data-save') || b.getAttribute('data-load') || b.getAttribute('data-del'), 10);
        if (b.hasAttribute('data-save')) { saveSlot(i); SOUND.sfx('select'); toast('已存档：第 ' + i + ' 槽'); openSave('save'); }
        else if (b.hasAttribute('data-load')) { var s = loadSlot(i); if (s) { SOUND.sfx('select'); closeModal(); applySnapshot(s); toast('已读取：第 ' + i + ' 槽'); } }
        else { localStorage.removeItem(VERSION + '_s' + i); SOUND.sfx('back'); openSave(mode); }
      };
    });
  }
  function openConfig() {
    var s = G.settings;
    var h = '<div class="set-row"><label>文字速度</label><input type="range" id="cfg-speed" min="0" max="90" step="2" value="' + s.speed + '"/><span class="val" id="v-speed">' + (s.speed <= 0 ? '瞬间' : s.speed + 'ms') + '</span></div>' +
      '<div class="set-row"><label>音乐音量</label><input type="range" id="cfg-music" min="0" max="100" value="' + Math.round(s.music * 100) + '"/><span class="val" id="v-music">' + Math.round(s.music * 100) + '</span></div>' +
      '<div class="set-row"><label>音效音量</label><input type="range" id="cfg-sfx" min="0" max="100" value="' + Math.round(s.sfx * 100) + '"/><span class="val" id="v-sfx">' + Math.round(s.sfx * 100) + '</span></div>' +
      '<div class="set-row"><label>演出特效</label><input type="checkbox" id="cfg-fx" ' + (s.effect ? 'checked' : '') + '/><span class="val"></span></div>' +
      '<div class="set-row"><label>自动播放间隔</label><input type="range" id="cfg-auto" min="400" max="4000" step="200" value="' + s.autoWait + '"/><span class="val" id="v-auto">' + s.autoWait + 'ms</span></div>';
    modal('设置', h);
    function bind(id, fn, vid, fmt) {
      var el = $(id); if (!el) return;
      el.oninput = el.onchange = function () { fn(el); if (vid) $(vid).textContent = fmt(el); };
    }
    bind('cfg-speed', function (el) { s.speed = parseInt(el.value, 10); }, 'v-speed', function (el) { return parseInt(el.value, 10) <= 0 ? '瞬间' : el.value + 'ms'; });
    bind('cfg-music', function (el) { s.music = parseInt(el.value, 10) / 100; SOUND.setMusicVol(s.music); }, 'v-music', function (el) { return el.value; });
    bind('cfg-sfx', function (el) { s.sfx = parseInt(el.value, 10) / 100; SOUND.setSfxVol(s.sfx); }, 'v-sfx', function (el) { return el.value; });
    bind('cfg-auto', function (el) { s.autoWait = parseInt(el.value, 10); }, 'v-auto', function (el) { return el.value + 'ms'; });
    var fx = $('cfg-fx'); if (fx) fx.onchange = function () { s.effect = fx.checked; };
    persistSettings();
  }
  function persistSettings() { store(VERSION + '_cfg', G.settings); }
  function openHelp() {
    modal('关于 / 操作', '<div class="help">' +
      '<h4>操作</h4>' +
      '<p>鼠标左键 / 空格 / 回车：推进对话 · 打字中点击＝立即显示全部</p>' +
      '<p>Ctrl（按住）：跳过已读 · A：自动播放 · H：历史回顾 · Esc：设置</p>' +
      '<p>存档为 5 槽手动 + 1 自动，进度实时写入浏览器本地存储。</p>' +
      '<h4>玩法</h4>' +
      '<p>本作共 4 个关键选项，只影响「好感」「记忆碎片」与 True Flag，不改变单线框架。' +
      'True End《下一个秋天》需要四个关键选项全部选对；否则进入 Normal End《把磁带交给下一个秋天》。</p>' +
      '<h4>主题</h4>' +
      '<p>全年龄 · 单女主 · 无后宫 · 无三角恋 · 场景限定在中国大学校园内。</p>' +
      '<h4>构成</h4>' +
      '<p>全部立绘、场景、CG 由程序化水彩 SVG 现场绘制；全部 BGM 由 WebAudio 实时合成。无任何外部素材文件。</p>' +
      '</div>');
  }

  // 渲染"当前所在节点"（用于开局 / 读档后，避免文本框空白）
  function renderCurrentNode() {
    var n = META.script[G.idx];
    if (!n || typeof n === 'string') return;
    if (n.text !== undefined) {
      var who = n.s || '';
      var isH = who === 'longer' || who === '她';
      spkEl.className = 'speaker' + (who ? (isH ? ' heroine' : '') : ' narr');
      if (!who) { spkEl.className = 'speaker empty'; spkEl.textContent = ''; }
      else spkEl.textContent = who === 'longer' ? 'longer' : who;
      typeWrite(n.text);
    }
  }

  /* ---------------- 从剧本重建画面 ---------------- */
  function renderFromScratch() {
    // 从当前位置向前回溯，恢复 bg / sprite / music / lamp
    BG.bg = null; BG.sprite = null; BG.music = null;
    setCG(null);
    spriteEl.innerHTML = '';
    var bg = null, spr = null, mus = null, lampOn = false, mirror = false, i, n;
    // 背景从当前节点往回找（BGM 早期设定，背景常常中途切换）
    for (i = Math.min(G.idx, META.script.length - 1); i >= 0; i--) {
      n = META.script[i]; if (typeof n === 'string') continue;
      if (n.t === 'bg') { bg = n.name; break; }
    }
    // 立绘 / 音乐 / 录音灯 从头顺序还原
    for (i = 0; i <= G.idx && i < META.script.length; i++) {
      n = META.script[i]; if (typeof n === 'string') continue;
      if (n.t === 'cg' || n.t === 'cgEnd') { spr = spr; }
      if (n.t === 'sprite') { spr = n.e; mirror = !!n.mirror; }
      else if (n.t === 'hide') spr = null;
      else if (n.t === 'music') mus = n.name;
      else if (n.t === 'lamp') lampOn = !!n.on;
    }
    setBG(bg);
    setSprite(spr, { mirror: mirror });
    if (mus) setMusic(mus);
    lamp(lampOn);
    // 若当前位置正是一句台词，先把台词显示出来，再继续流程
    var cur = META.script[G.idx];
    if (cur && typeof cur !== 'string' && cur.text !== undefined && cur.t === undefined && cur.s === undefined) {
      renderCurrentNode();
      return;
    }
    if (cur && typeof cur !== 'string' && cur.text !== undefined) { renderCurrentNode(); return; }
    run();
  }

  /* ---------------- 启动 ---------------- */
  function startNew() {
    G.flags = {}; G.mem = []; G.love = 0; G.history = []; G.choiceLog = []; G.idx = 0; G.chapter = '序章';
    BG.bg = null; BG.sprite = null; BG.music = null; BG.cg = null;
    cgEl.innerHTML = ''; spriteEl.innerHTML = '';
    showScreen('game-screen');
    renderFromScratch();
  }
  function showScreen(id) {
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) { s.classList.remove('active'); });
    $(id).classList.add('active');
    if (id === 'game-screen' && G.rebind) { try { G.rebind(); } catch (e) { } }
  }
  function bindHud() {
    Array.prototype.forEach.call(document.querySelectorAll('.hbtn'), function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var a = b.getAttribute('data-act');
        SOUND.resume();
        if (a === 'auto') { G.autoOn = !G.autoOn; b.classList.toggle('active', G.autoOn); toast(G.autoOn ? '自动播放：开' : '自动播放：关'); if (G.autoOn) click(); }
        else if (a === 'skip') { G.skipOn = !G.skipOn; b.classList.toggle('active', G.skipOn); toast(G.skipOn ? '跳过：开（仅已读）' : '跳过：关'); if (G.skipOn) click(); }
        else if (a === 'log') openLog();
        else if (a === 'save') openSave('save');
        else if (a === 'load') openSave('load');
        else if (a === 'config') openConfig();
        else if (a === 'title') { autoSave(); showScreen('title-screen'); }
      };
    });
  }
  function bindInput() {
    window.__bind = (window.__bind || 0) + 1;
    document.addEventListener('keydown', function (e) {
      if ($('modal').classList.contains('on')) { if (e.key === 'Escape') closeModal(); return; }
      if (!$('game-screen').classList.contains('active')) {
        if (e.key === ' ' || e.key === 'Enter') { var b = document.querySelector('.t-btn.primary'); if (b && $('title-screen').classList.contains('active')) b.click(); }
        return;
      }
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); click(); }
      else if (e.key === 'a' || e.key === 'A') { G.autoOn = !G.autoOn; toast(G.autoOn ? '自动播放：开' : '自动播放：关'); if (G.autoOn) click(); }
      else if (e.key === 'h' || e.key === 'H') openLog();
      else if (e.key === 'Escape') openConfig();
      else if (e.key === 'Control') G.skipOn = true;
    });
    document.addEventListener('keyup', function (e) { if (e.key === 'Control') G.skipOn = false; });
    // 舞台点击：同时挂在 game-screen 与 document 上，双保险；用 rAF 做重复触发保护
    function stageClick(e) {
      if (!document.getElementById('game-screen').classList.contains('active')) return;
      if (e.target && e.target.classList && e.target.classList.contains('hbtn')) return;
      if (choiceEl.classList.contains('on')) return;
      var now = Date.now();
      if (now - (G._lastClickAt || 0) < 30) return;   // 两个监听别重复触发
      G._lastClickAt = now;
      click();
    }
    document.getElementById('game-screen').addEventListener('click', stageClick);
    document.addEventListener('click', stageClick);
    document.getElementById('choice-layer').addEventListener('click', function (e) { e.stopPropagation(); });
    G.rebind = function () {
      var gs = document.getElementById('game-screen');
      gs.removeEventListener('click', stageClick);
      gs.addEventListener('click', stageClick);
      document.removeEventListener('click', stageClick);
      document.addEventListener('click', stageClick);
    };
  }
  function bindTitle() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (b) {
      if (b.classList.contains('hbtn')) return;
      var a = b.getAttribute('data-act');
      if (a === 'start') b.onclick = function () { SOUND.init(); SOUND.resume(); SOUND.sfx('select'); showScreen('name-screen'); $('name-input').focus(); };
      else if (a === 'continue') b.onclick = function () {
        SOUND.init(); SOUND.resume();
        var s = lastSave();
        if (!s) { toast('还没有任何存档'); return; }
        showScreen('game-screen');
        if (s.name) G.name = s.name;
        applySnapshot(s);
        toast('继续收听 · ' + s.chapter);
      };
      else if (a === 'gallery') b.onclick = function () { SOUND.init(); SOUND.sfx('select'); openGallery(); };
      else if (a === 'music') b.onclick = function () { SOUND.init(); SOUND.resume(); SOUND.sfx('select'); openMusic(); };
      else if (a === 'help') b.onclick = function () { SOUND.sfx('select'); openHelp(); };
    });
    $('name-ok').onclick = function () {
      var v = ($('name-input').value || '').trim();
      G.name = v || '江知远';
      SOUND.sfx('select'); startNew();
    };
    $('name-default').onclick = function () { $('name-input').value = '江知远'; $('name-ok').click(); };
    $('name-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('name-ok').click(); });
  }
  function bootScript(meta) {
    META = meta;
    bgEl = $('bg-layer'); spriteEl = $('sprite-layer'); cgEl = $('cg-layer');
    textEl = $('text'); spkEl = $('speaker'); nextEl = $('nextmark');
    choiceEl = $('choice-layer'); chapterEl = $('chapter-card'); endingEl = $('ending-card');
    toastEl = $('toast');
    cgEl.style.display = 'none';
    // 读取进度
    G.cgs = load(VERSION + '_cg') || {};
    G.mus = load(VERSION + '_mus') || {};
    var cfg = load(VERSION + '_cfg'); if (cfg) for (var k in cfg) G.settings[k] = cfg[k];
    // 标题背景
    $('title-art').innerHTML = ARTWORK.get('title');
    bindHud(); bindInput(); bindTitle();
    // 调试：?jump=节点序号  直接跳到某句台词（供截图/自测）
    var q = /[?&]jump=(\d+)/.exec(location.search);
    if (q) {
      var n = parseInt(q[1], 10);
      G.flags = {}; G.mem = []; G.love = 0; G.history = [];
      var fq = /[?&]flags=([a-z_,0-9]+)/.exec(location.search);
      if (fq) fq[1].split(',').forEach(function (k) { if (k) G.flags[k] = 1; });
      var lq = /[?&]love=(\d+)/.exec(location.search);
      if (lq) G.love = parseInt(lq[1], 10);
      var nq = /[?&]player=([^&]+)/.exec(location.search);
      if (nq) G.name = decodeURIComponent(nq[1]);
      G.idx = n; G.chapter = '调试';
      showScreen('game-screen');
      renderFromScratch();
      // ?local=1 时禁用「继续收听」，避免自动存档覆盖调试状态
      if (/[?&]local=1/.test(location.search)) {
        var cb = document.querySelector('[data-act="continue"]');
        if (cb) cb.style.display = 'none';
      }
    }
    // 空格推进已绑定
    document.addEventListener('mousedown', function () { SOUND.resume(); }, { once: true });
  }
  return { boot: bootScript, get state() { return G; }, showScreen: showScreen };
})();


/* ---- 剧本装配与启动 ---- */
var SCRIPT = [].concat(SCRIPT_0, SCRIPT_1, SCRIPT_2);
window.__S = SCRIPT;
Game.boot({ script: SCRIPT, title: META_TITLE, musiclist: META_MUSIC, cglist: META_CG, version: '1.0' });

</script>
